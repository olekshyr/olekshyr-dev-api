spring.config.import=optional:file:.env[.properties]

spring.application.name=${APP_NAME:api}

spring.jpa.hibernate.ddl-auto=validate

# OTLP endpoints come from OTLP_TRACING_ENDPOINT / OTLP_LOGGING_ENDPOINT / OTLP_METRICS_ENDPOINT,
# mapped by logging.OtlpEndpointEnvironmentPostProcessor only when set (unset = no export)
management.tracing.sampling.probability=${TRACING_SAMPLING_RATE:0.1}

logging.level.web=${LOGGING_LEVEL_WEB:INFO}

app.security.headerName=${APP_SECURITY_HEADER_NAME:X-API-Key}
app.security.publicApiKey=${PUBLIC_API_KEY:}
app.security.adminApiKey=${ADMIN_API_KEY:}

# Swagger UI and /v3/api-docs skip the API key only when true (D22); keep off in prod
app.docs.public=${APP_DOCS_PUBLIC:false}

# Pagination (D4): bad input is corrected, never rejected
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.page.serialization-mode=via_dto
