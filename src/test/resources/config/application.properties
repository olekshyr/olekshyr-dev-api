# Test overrides. This lives in config/ so the main application.properties still loads
# in tests (a root-level test file would shadow it); config/ wins on conflicting keys.
app.security.headerName=X-Api-Key
app.security.publicApiKey=test-public-key
app.security.adminApiKey=test-admin-key
# Pin it off so a developer's .env (imported by the main file) can't change test behavior
app.docs.public=false
